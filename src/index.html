<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWDI Scoring Test Runner</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2b4c77;--teal:#0f766e;--ink:#1d2733;--muted:#5d6b7a;--line:#dfe5ec;--bg:#f4f6f9;--card:#fff;
--pass:#1b7f4b;--passbg:#e2f5ea;--fail:#b42318;--failbg:#fde4e2;--amber:#9a6200;--amberbg:#fff3d6;--blue:#1d5fb4;--bluebg:#e3eefc;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff;min-height:48px}
.top h1{font-size:16px;margin:0;font-weight:650}.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;white-space:nowrap}
.top input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:3px 7px}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 48px)}
aside{border-right:1px solid var(--line);background:#fff;overflow:auto;max-height:calc(100vh - 48px);position:sticky;top:48px;padding:10px}
.navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.navbtn:hover{background:#f1f4f8}.navbtn.on{background:#e8eef6;border-color:#cfdbe9}
.navbtn .t{font-weight:600}.navbtn .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.newbtn{width:100%;margin:6px 0 10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 4px 4px}
main{padding:18px 22px 100px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:0 0 10px}h4{margin:0 0 6px;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:#eef1f5;color:#3a4756;white-space:nowrap}
.v-PASS{background:var(--passbg);color:var(--pass)}.v-FAIL{background:var(--failbg);color:var(--fail)}
.v-STATA{background:var(--amberbg);color:var(--amber)}.v-ROUNDING{background:var(--amberbg);color:var(--amber)}.v-NA{background:var(--bluebg);color:var(--blue)}.v-CHECK{background:var(--bluebg);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:24px;line-height:1.1}.kpi .lab{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{color:var(--navy);border-color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{background:#f5f7fa}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.sm{padding:3px 8px;font-size:12px}.btn.danger{color:var(--fail)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:14px;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:none;background:#fff;padding:6px 12px;cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
.roster input,.roster select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
details.sec{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:650;display:flex;gap:8px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 16px;padding:4px 12px 12px}
.f{display:flex;flex-direction:column;gap:3px;padding:7px 8px;border-radius:7px}
.f.sug{background:#f4f9ff}.f.chg{background:#fff6e0}
.f .q{font-size:12.5px}.f .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--muted)}
.f select,.f input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
.f .opts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
.tg{font-size:11px;color:#1d5fb4}.tg b{font-weight:600}.chgnote{font-size:11px;color:#8a5a00}
.mcard{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff;overflow:hidden}
.mhead{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#f7f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead .nm{font-weight:700}
.sticky{position:sticky;bottom:0;background:rgba(244,246,249,.96);padding:10px 0;margin-top:10px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);z-index:5}
.heat{overflow:auto}.heat table{width:auto}.heat td,.heat th{padding:4px 6px;font-size:12px;border:1px solid #eef1f5;text-align:center;min-width:52px}
.heat td.l{text-align:left;min-width:230px;white-space:nowrap}.heat td.c{cursor:pointer}.heat td.c:hover{outline:2px solid var(--navy)}
.cf{box-shadow:inset 0 -3px 0 #e2a400}
.vin{width:86px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right}
.banner{border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}.banner.warn{background:var(--amberbg);color:#6d4a00}.banner.info{background:var(--bluebg);color:#173f73}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ind{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.ind .h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eef1f5;flex-wrap:wrap}
.ind .h .lv{margin-left:auto;display:flex;gap:8px;align-items:center}
.big{font-size:18px;font-weight:700;min-width:44px;text-align:right}
.why{padding:8px 12px;font-size:13px}.why .fam{background:#f7f9fc;border-radius:6px;padding:6px 8px;margin-bottom:6px}
.mtab td{font-size:12.5px;padding:4px 6px}.mtab tr.ex td{color:#8a96a3}
.crit{font-size:12.5px;padding:0 12px 10px}.crit li{margin:2px 0}
.toast{position:fixed;right:18px;bottom:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}
.toast.on{opacity:1;transform:none}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;align-items:center}
.tchip{display:inline-block;font-size:11px;background:#e3eefc;color:#173f73;border-radius:4px;padding:0 5px;margin:1px 3px 1px 0}
table.rep{margin:6px 0}table.rep td,table.rep th{border:1px solid #e3e8ee}
.finding{border-left:3px solid #e2a400;padding:6px 10px;margin:10px 0;background:#fffdf6}
@media print{.top,aside,.noprint,.toast{display:none!important}.wrap{display:block}main{padding:0}#report{border:none;padding:0}body{background:#fff}.finding{break-inside:avoid}}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>SWDI Scoring Test Runner</h1>
  <span class="chip" id="modeChip">loading…</span>
  <span class="sp"></span>
  <span class="chip" id="thChip"></span>
  <label class="chip">Tester <input id="tester" list="testerList" placeholder="your name" style="width:150px"><datalist id="testerList"></datalist></label>
</div>
<div class="wrap">
  <aside>
    <button class="btn pri newbtn" id="newRun">+ New test run</button>
    <button class="navbtn" data-view="overview"><div class="t">Overview &amp; coverage</div><div class="s">Progress, matrix, scenarios</div></button>
    <button class="navbtn" data-view="criteria"><div class="t">Scoring criteria</div><div class="s">Levels, coverage, weights per indicator</div></button>
    <button class="navbtn" data-view="reports"><div class="t">Reports</div><div class="s">Weekly findings, final report</div></button>
    <div class="lbl">Test runs</div>
    <div id="runList"></div>
  </aside>
  <main id="main"><div class="card">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>
<script>/*ENGINE*/</script>
<script>/*PLANNER*/</script>
<script>/*FIELDS*/</script>
<script>/*SCENARIOS*/</script>
<script>
var DEMO = /*DEMO*/null;
var IND = SWDI.INDICATORS, FIELDS = SWDIFields.FIELDS, LISTS = SWDIFields.LISTS, SC = SWDIScenarios;
var TOTALS = [{ code: 'ES', name: 'Raw ES score' }, { code: 'SA', name: 'Raw SA score' }, { code: 'TOTAL', name: 'TOTAL SWDI score' }, { code: 'LOWB', name: 'LOWB (1-3)' }];
var STATUSES = ['Draft', 'Entering in SWDI App', 'Synced — verify scores', 'Verified in SWDI App', 'Verified in 4Ps Forward', 'Blocked'];
var STATA_NOTES = { A: 'Stata covers 18+ only and reads gradel (currently attending) only.', C: 'Stata: family size = all captured members − OFW; under-15 income counted; no imputed rent.',
  E: 'Stata counts insurance and accounts separately (A insurance + B account stays Level 2).', F: 'Stata Level 1 has no "got sick" qualifier.', G: 'Stata: not sick → Level 3 even if confined/chronic = Yes.',
  H: 'Stata ignores overweightind, and moderate overwrites severe.', I: 'Stata keeps piped (11, 12) in the > 30 min rule; blank minutes count as > 30.', J: 'Stata operator precedence: any toilet with shared = No passes the Level 2 line.',
  L: 'Stata overwrite turns all-No (Level 1) into Level 2.', O: 'Stata overwrite ignores hazard-prone (light → 2, strong → 3).', P: 'Stata overwrite ignores hazard-prone.', U: 'Stata: any resolved problem overwrites to Level 3 (no worst case).',
  V: 'Stata: 1 or more members → Level 2 (DSWD asked for exactly 1).', W: 'Stata: any vaccine counts, enrolment only, needs all 4 for Level 3.', Y: 'Stata: any kit item counts, savings not counted, volcanic eruption missing; 3 items without savings → no level.' };
var ALIASES = { A: ['employable skill'], B: ['employment'], C: ['income'], D: ['social security', 'sss/gsis', 'sss'], E: ['financial institution'],
  F: ['availment', 'accessible health', 'health service'], G: ['health condition'], H: ['nutrition'], I: ['drinking water', 'improved water'], J: ['sanitary', 'toilet', 'sanitation'],
  K: ['garbage'], L: ['functional literacy'], M: ['digital literacy'], N: ['school', 'attendance', 'enrolment', 'enrollment'], O: ['roof'], P: ['outer wall', 'walls'],
  Q: ['tenure'], R: ['lighting'], S: ['ownership of assets', 'assets'], T: ['parenting'], U: ['discern', 'arrive at solutions'], V: ['participation', 'organization'],
  W: ['rights of children', "children's rights", 'children rights'], X: ['gender'], Y: ['disaster', 'drrm'] };
var S = { data: null, view: 'overview', run: null, tab: 'roster', live: false, showAll: false, dirty: false };

// ---------- utils ----------
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function num(v) { return SWDI.num(v); }
function fmt(x, d) { if (x === null || x === undefined || x === '') return '—'; var n = Number(x); if (isNaN(n)) return esc(x); d = d === undefined ? 4 : d; return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(d).replace(/0+$/, '').replace(/\.$/, ''); }
function lvlTxt(x) { return x === null || x === undefined || x === '' ? 'N/A' : fmt(x, 2); }
function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, 2600); }
function vcls(v) { return v === 'PASS' ? 'v-PASS' : v === 'FAIL' ? 'v-FAIL' : v === 'STATA RULE' ? 'v-STATA' : v === 'ROUNDING' ? 'v-ROUNDING' : v === 'N/A CHECK' ? 'v-NA' : v === 'CHECK' ? 'v-CHECK' : ''; }
function pill(v) { return v ? '<span class="pill ' + vcls(v) + '">' + esc(v) + '</span>' : ''; }
function store(k, v) { try { localStorage.setItem('swdi-runner-' + k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem('swdi-runner-' + k)); } catch (e) { return null; } }
function th() { var c = S.data.config, R = S.run; if (R && R.food !== '' && R.food !== undefined && R.pov !== '' && R.pov !== undefined) return { food: num(R.food), poverty: num(R.pov) }; return { food: num(c.food_threshold), poverty: num(c.poverty_threshold) }; }
function tester() { return $('#tester').value; }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function listLabel(list, v) { var L = LISTS[list] || {}; return L[String(v)] || ''; }

// ---------- server bridge ----------
function call(fn, args, ok) {
  if (S.live) {
    var r = google.script.run.withSuccessHandler(function (x) { ok && ok(x); }).withFailureHandler(function (e) { toast('Error: ' + e.message); });
    r[fn].apply(r, args);
  } else demoCall(fn, args, ok);
}
function demoCall(fn, args, ok) {
  var db = load('db') || { runs: [], roster: [], entries: [], scores: [] };
  if (fn === 'getRun') { var id = args[0], f = function (r) { return r['Run ID'] === id; }; ok(JSON.stringify({ roster: db.roster.filter(f), entries: db.entries.filter(f), scores: db.scores.filter(f) })); return; }
  if (fn === 'saveRun') {
    var p = JSON.parse(args[0]), run = p.run;
    if (!run['Run ID']) { var d = today().replace(/-/g, ''), n = db.runs.filter(function (r) { return String(r['Run ID']).indexOf('RUN-' + d) === 0; }).length + 1; run['Run ID'] = 'RUN-' + d + '-' + ('0' + n).slice(-2); }
    var id2 = run['Run ID'], stamp = function (rows) { return rows.map(function (r) { r['Run ID'] = id2; r.Key = id2 + '|' + r.Key.split('|').slice(1).join('|'); return r; }); };
    db.runs = db.runs.filter(function (r) { return r['Run ID'] !== id2; }).concat([run]);
    ['roster', 'entries', 'scores'].forEach(function (k) { db[k] = db[k].filter(function (r) { return r['Run ID'] !== id2; }).concat(stamp(p[k] || [])); });
    store('db', db); S.data.runs = db.runs; S.data.scores = db.scores; ok(id2); return;
  }
  if (fn === 'deleteRun') { var rid = args[0]; ['runs', 'roster', 'entries', 'scores'].forEach(function (k) { db[k] = db[k].filter(function (r) { return r['Run ID'] !== rid; }); }); store('db', db); S.data.runs = db.runs; S.data.scores = db.scores; ok(true); }
}

// ---------- coverage ----------
function finalVerdict(r) {
  var vs = [r['SWDI App verdict'], r['4Ps Forward verdict']].filter(Boolean);
  if (!vs.length) return '';
  if (vs.indexOf('FAIL') >= 0) return 'FAIL';
  if (vs.indexOf('STATA RULE') >= 0) return 'STATA RULE';
  if (vs.indexOf('ROUNDING') >= 0) return 'ROUNDING';
  if (vs.indexOf('N/A CHECK') >= 0) return 'N/A CHECK';
  return 'PASS';
}
function coverage() {
  var cov = {};
  (S.data.scores || []).forEach(function (r) {
    var v = finalVerdict(r);
    String(r['Scenarios exercised'] || '').split('|').filter(Boolean).forEach(function (id) { (cov[id] = cov[id] || { runs: {}, v: [] }).runs[r['Run ID']] = 1; if (v) cov[id].v.push(v); });
  });
  return cov;
}
function scenarioStatus(c) {
  if (!c) return 'Not tested';
  if (c.v.indexOf('FAIL') >= 0) return 'FAIL';
  if (c.v.indexOf('STATA RULE') >= 0) return 'STATA RULE';
  if (c.v.indexOf('PASS') >= 0) return 'PASS';
  if (c.v.length) return 'CHECK';
  return 'Planned';
}

// ---------- run model ----------
function newRun() {
  return { id: '', fam: '', mode: 'Guided', date: today(), status: 'Draft', notes: '', food: S.data.config.food_threshold, pov: S.data.config.poverty_threshold, roster: [{ no: 1, name: '', age: '', sex: 2, reln: 1, status: 1 }],
    values: { hh: {}, m: {} }, suggested: { hh: {}, m: {} }, targets: {}, obs: { swdi: {}, fpf: {}, mode: { swdi: 'level', fpf: 'level' } }, planned: false };
}
function engineHousehold(run) {
  return { hh: run.values.hh, members: run.roster.filter(function (r) { return r.age !== '' && r.age !== null; }).map(function (r) {
    return Object.assign({ no: Number(r.no), name: r.name, age: Number(r.age), status: Number(r.status) || 1 }, run.values.m[r.no] || {});
  }) };
}
function expectedFor(run) { return SWDI.scoreBoth(engineHousehold(run), { thresholds: th() }); }

// ---------- sidebar ----------
function renderNav() {
  var cov = (S.data.scores || []), runs = (S.data.runs || []).slice().sort(function (a, b) { return String(b['Run ID']).localeCompare(String(a['Run ID'])); });
  $('#runList').innerHTML = (S.view === 'run' && S.run && !S.run.id ? '<button class="navbtn on"><div class="t">New run (unsaved)</div><div class="s">' + esc(S.run.fam || 'Family ID not set') + '</div></button>' : '') +
    (runs.length ? runs.map(function (r) {
      var id = r['Run ID'], rs = cov.filter(function (x) { return x['Run ID'] === id; });
      var pass = rs.filter(function (x) { return finalVerdict(x) === 'PASS'; }).length, bad = rs.filter(function (x) { var v = finalVerdict(x); return v && v !== 'PASS'; }).length;
      return '<button class="navbtn' + (S.view === 'run' && S.run && S.run.id === id ? ' on' : '') + '" data-run="' + esc(id) + '"><div class="t">' + esc(id) + '</div><div class="s"><span>' + esc(r['Family ID (HHID)'] || '—') + '</span>' +
        '<span class="pill">' + esc(r.Mode || '') + '</span><span>' + esc(r.Status || '') + '</span>' + (pass ? '<span class="pill v-PASS">' + pass + ' pass</span>' : '') + (bad ? '<span class="pill v-FAIL">' + bad + ' issue</span>' : '') + '</div></button>';
    }).join('') : '<p class="small muted" style="padding:0 6px">No runs yet. Start with “New test run”.</p>');
  $$('.navbtn[data-view]').forEach(function (b) { b.classList.toggle('on', S.view === b.dataset.view); });
}

// ---------- overview ----------
function kpi(b, s) { return '<div class="kpi"><b>' + b + '</b><span class="lab">' + s + '</span></div>'; }
function renderOverview() {
  var R = S.data.scores || [], runs = S.data.runs || [], cov = coverage();
  var exe = R.filter(function (r) { return finalVerdict(r); }), cnt = function (v) { return exe.filter(function (r) { return finalVerdict(r) === v; }).length; };
  var tested = SC.filter(function (s) { var st = scenarioStatus(cov[s.id]); return st !== 'Not tested' && st !== 'Planned'; }).length;
  var planned = SC.filter(function (s) { return cov[s.id]; }).length;
  var html = '<h2>Overview</h2><p class="muted">' + runs.length + ' test run(s) · ' + SC.length + ' scenarios in the catalog (levels, boundaries, option spread, rule conflicts, open rules).</p><div class="kpis">' +
    kpi(runs.filter(function (r) { return r.Status === 'Verified in 4Ps Forward'; }).length + ' / ' + runs.length, 'runs verified in 4Ps Forward') + kpi(exe.length, 'indicator checks executed') +
    kpi('<span style="color:var(--pass)">' + cnt('PASS') + '</span>', 'PASS') + kpi('<span style="color:var(--fail)">' + cnt('FAIL') + '</span>', 'FAIL') +
    kpi('<span style="color:var(--amber)">' + (cnt('STATA RULE') + cnt('ROUNDING')) + '</span>', 'STATA RULE / ROUNDING') +
    kpi(Math.round(100 * tested / SC.length) + '%', 'scenarios verified (' + tested + '/' + SC.length + '); ' + planned + ' exercised') + '</div>';
  if (runs.length) {
    var rs = runs.slice().sort(function (a, b) { return String(a['Run ID']).localeCompare(String(b['Run ID'])); });
    html += '<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3>Indicator × test run</h3><div class="legend">' + pill('PASS') + pill('FAIL') + pill('STATA RULE') + pill('ROUNDING') + pill('N/A CHECK') +
      '<span class="pill cf">rule conflict</span><span class="muted">cell = expected level</span></div></div><div class="heat"><table><tr><th></th>' + rs.map(function (r) { return '<th title="' + esc(r['Family ID (HHID)']) + '">' + esc(String(r['Run ID']).slice(-11)) + '</th>'; }).join('') + '</tr>';
    IND.concat([TOTALS[2], TOTALS[3]]).forEach(function (d) {
      html += '<tr><td class="l"><b>' + d.code + '</b> ' + esc(d.name) + '</td>' + rs.map(function (r) {
        var x = R.filter(function (s) { return s['Run ID'] === r['Run ID'] && s.Code === d.code; })[0]; if (!x) return '<td></td>';
        var v = finalVerdict(x), e = x['Expected level (target)'];

  if ($('#repFrom')) { $('#repFrom').onchange = function () { st.from = this.value; renderReports(); }; $('#repTo').onchange = function () { st.to = this.value; renderReports(); }; }
  $('#repPrint').onclick = function () { try { window.print(); } catch (e) { toast('Printing is blocked here — use Copy for Docs'); } };
  $('#repCopy').onclick = function () {
    var el = $('#report'), html = el.innerHTML;
    var done = function () { toast('Report copied — paste into Google Docs or Word'); };
    try {
      if (navigator.clipboard && window.ClipboardItem) { navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([el.innerText], { type: 'text/plain' }) })]).then(done, fallback); }
      else fallback();
    } catch (e) { fallback(); }
    function fallback() { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); done(); } catch (e) { toast('Select the report and copy it manually'); } s.removeAllRanges(); }
  };
  $('#report').innerHTML = reportHTML(buildReport(st.from, st.to, st.preset === 'all' ? 'final' : 'weekly'));
}
function reportHTML(R) {
  var c = S.data.config, final = R.kind === 'final';
  var period = final ? 'All runs to date' : R.from + ' to ' + R.to;
  var pct = function (a, b) { return b ? Math.round(100 * a / b) + '%' : '—'; };
  var h = '<h2 style="margin-bottom:2px">' + (final ? 'SWDI Scoring Test — Final report' : 'SWDI Scoring Test — Weekly report') + '</h2>' +
    '<div class="muted small">Period: <b>' + esc(period) + '</b> · Generated ' + esc(today()) + (tester() ? ' by ' + esc(tester()) : '') + (c.app_version ? ' · SWDI App build ' + esc(c.app_version) : '') + '</div>';
  h += '<h3 style="margin-top:16px">1. Summary</h3><table class="rep"><tr><td>Test runs (interviews) in period</td><td class="num"><b>' + R.runs.length + '</b></td><td>Cumulative runs</td><td class="num"><b>' + R.runsAll.length + '</b></td></tr>' +
    '<tr><td>Runs verified in 4Ps Forward</td><td class="num">' + R.verified4pf + '</td><td>Indicator checks executed</td><td class="num">' + R.exe.length + '</td></tr>' +
    '<tr><td>PASS</td><td class="num">' + R.count(R.exe, 'PASS') + ' (' + pct(R.count(R.exe, 'PASS'), R.exe.length) + ')</td><td>FAIL</td><td class="num">' + R.count(R.exe, 'FAIL') + '</td></tr>' +
    '<tr><td>STATA RULE (DSWD change not implemented)</td><td class="num">' + R.count(R.exe, 'STATA RULE') + '</td><td>ROUNDING</td><td class="num">' + R.count(R.exe, 'ROUNDING') + '</td></tr>' +
    '<tr><td>Scenario coverage (cumulative)</td><td class="num">' + R.covered + ' / ' + R.total + ' (' + pct(R.covered, R.total) + ')</td><td>' + (final ? 'Not yet covered' : 'New scenarios this period') + '</td><td class="num">' + (final ? R.missing.length : R.newly) + '</td></tr></table>';
  var sev = R.findings.filter(function (f) { return f.verdict !== 'N/A CHECK'; });
  h += '<h3 style="margin-top:16px">2. Findings (' + sev.length + ')</h3>';
  if (!sev.length) h += '<p class="muted">No mismatches in this period.</p>';
  sev.forEach(function (f, i) {
    var runs = f.items.map(function (x) { return x.run; }).filter(function (x, j, a) { return a.indexOf(x) === j; });
    var meaning = f.verdict === 'FAIL' ? 'Platform score matches neither the DSWD target rule nor the Stata command as written.' : f.verdict === 'STATA RULE' ? 'Platform follows the BRVD Stata command as written; the DSWD-requested change is not implemented.' + (STATA_NOTES[f.code] ? ' ' + STATA_NOTES[f.code] : '') :
      f.verdict === 'ROUNDING' ? 'Platform rounds the family average to a whole level instead of using the unrounded average.' : 'SWDI App and 4Ps Forward show different values for the same assessment.';
    h += '<div class="finding"><b>F' + (i + 1) + '. ' + f.code + ' — ' + esc(f.name) + '</b> <span class="pill ' + vcls(f.verdict) + '">' + esc(f.verdict) + '</span> <span class="small muted">' + runs.length + ' run(s) · ' + Object.keys(f.platforms).join(', ') + '</span>' +
      '<div class="small" style="margin:4px 0">' + esc(meaning) + '</div><table class="rep small"><tr><th>Run</th><th>Platform</th><th class="num">Expected</th><th class="num">Stata</th><th class="num">Observed</th><th>How the expected level was graded</th></tr>' +
      f.items.slice(0, 8).map(function (x) { return '<tr><td>' + esc(x.run) + '</td><td>' + esc(x.platform) + '</td><td class="num">' + lvlTxt(x.expected) + '</td><td class="num">' + (x.stata === undefined || x.stata === '' ? '—' : lvlTxt(x.stata)) + '</td><td class="num">' + esc(x.observed) + '</td><td>' + esc(String(x.why || '').slice(0, 220)) + '</td></tr>'; }).join('') +
      (f.items.length > 8 ? '<tr><td colspan="6" class="muted">… ' + (f.items.length - 8) + ' more</td></tr>' : '') + '</table></div>';
  });
  h += '<h3 style="margin-top:16px">3. Results by indicator</h3><table class="rep small"><tr><th>Indicator</th><th class="num">Checks</th><th class="num">PASS</th><th class="num">FAIL</th><th class="num">STATA RULE</th><th class="num">ROUNDING</th><th class="num">N/A CHECK</th><th class="num">Pass rate</th></tr>' +
    R.perInd.map(function (p) { return '<tr><td><b>' + p.code + '</b> ' + esc(p.name) + '</td><td class="num">' + p.n + '</td><td class="num">' + p.pass + '</td><td class="num">' + (p.fail ? '<b style="color:var(--fail)">' + p.fail + '</b>' : 0) + '</td><td class="num">' + (p.stata ? '<b style="color:var(--amber)">' + p.stata + '</b>' : 0) + '</td><td class="num">' + p.round + '</td><td class="num">' + p.na + '</td><td class="num">' + pct(p.pass, p.n) + '</td></tr>'; }).join('') + '</table>';
  h += '<h3 style="margin-top:16px">4. Test runs' + (final ? '' : ' in this period') + '</h3>' + (R.runs.length ? '<table class="rep small"><tr><th>Run</th><th>Family ID</th><th>Date</th><th>Tester</th><th>Mode</th><th>Status</th><th class="num">Expected total / LOWB</th><th class="num">App total</th><th class="num">4PsF total</th><th class="num">Pass / issues</th></tr>' +
    R.runs.map(function (r) { return '<tr><td>' + esc(r['Run ID']) + '</td><td>' + esc(r['Family ID (HHID)']) + '</td><td>' + esc(runDate(r)) + '</td><td>' + esc(r.Tester) + '</td><td>' + esc(r.Mode) + '</td><td>' + esc(r.Status) + '</td><td class="num">' + fmt(r['Expected total (target)'], 4) + ' / L' + esc(r['Expected LOWB']) +
      '</td><td class="num">' + fmt(r['SWDI App total'], 4) + '</td><td class="num">' + fmt(r['4Ps Forward total'], 4) + '</td><td class="num">' + esc(r['Checks passed']) + ' / ' + esc(r['Checks not passed']) + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">No runs in this period.</p>');
  var byNeed = {}; R.missing.forEach(function (s) { (byNeed[s.needs] = byNeed[s.needs] || []).push(s); });
  h += '<h3 style="margin-top:16px">5. Coverage still needed (' + R.missing.length + ' scenarios)</h3>' + (R.missing.length ? '<p class="small muted">Use this to choose next week\'s households: the "Needs" column says what kind of member the household must have.</p><table class="rep small"><tr><th>Needs</th><th class="num">Scenarios</th><th>Examples</th></tr>' +
    Object.keys(byNeed).sort(function (a, b) { return byNeed[b].length - byNeed[a].length; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="num">' + byNeed[k].length + '</td><td>' + byNeed[k].slice(0, 3).map(function (s) { return esc(s.desc); }).join('; ') + '</td></tr>'; }).join('') + '</table>' : '<p>All catalogued scenarios have been exercised.</p>');
  h += '<h3 style="margin-top:16px">6. Rules to confirm with SCMD</h3><table class="rep small"><tr><th>Indicator</th><th>Open question</th><th class="num">Runs that hit it</th></tr>' +
    R.openRules.map(function (o) { return '<tr><td>' + o.s.ind + '</td><td>' + esc(o.s.desc) + '</td><td class="num">' + o.runs + '</td></tr>'; }).join('') +
    '<tr><td>—</td><td>Indicators with no eligible member (N/A): how the platform scores them</td><td class="num">' + R.naChecks + ' check(s)</td></tr></table>';
  if (final) {
    var openF = R.findings.filter(function (f) { return f.verdict === 'FAIL' || f.verdict === 'STATA RULE' || f.verdict === 'ROUNDING'; }).length;
    h += '<h3 style="margin-top:16px">7. Completion status</h3><ul class="small"><li>Scenario coverage: <b>' + pct(R.covered, R.total) + '</b> (' + R.covered + ' of ' + R.total + ').</li><li>Open findings: <b>' + openF + '</b> (FAIL, STATA RULE or ROUNDING groups).</li>' +
      '<li>Runs verified in 4Ps Forward: <b>' + R.verified4pf + '</b> of ' + R.runs.length + '.</li><li>Open rule confirmations: <b>' + R.openRules.length + '</b>.</li></ul>' +
      '<p class="small muted">Scoring can be signed off when coverage is complete (or the remaining scenarios are explicitly waived), every finding is fixed and re-tested to PASS, and SCMD has confirmed the open rules.</p>' +
      '<table class="rep small" style="margin-top:12px"><tr><th>Prepared by</th><th>Reviewed by</th><th>Approved by</th></tr><tr><td style="height:48px"></td><td></td><td></td></tr></table>';
  }
  return h;
}

// ---------- boot ----------
function route() {
  renderNav();
  if (S.view === 'overview') renderOverview(); else if (S.view === 'criteria') renderCriteria(); else if (S.view === 'reports') renderReports(); else renderRun();
  window.scrollTo(0, 0);
}
function boot(json) {
  var d = typeof json === 'string' ? JSON.parse(json) : json;
  S.data = d; S.live = !!d.live;
  if (!S.live) { var db = load('db'); if (db) { d.runs = db.runs; d.scores = db.scores; } var cf = load('config'); if (cf) Object.assign(d.config, cf); }
  $('#modeChip').textContent = S.live ? 'Live · Google Sheet' : 'Preview · data stays in this browser';
  var names = (d.testers || []).slice(); if (d.user && names.indexOf(d.user) < 0) names.unshift(d.user);
  $('#testerList').innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  $('#tester').value = load('tester') || d.user || '';
  $('#tester').onchange = function () { store('tester', $('#tester').value); };
  var c = d.config;
  function thChip() {
    if (S.live) { $('#thChip').textContent = 'Food ₱' + c.food_threshold + ' · Poverty ₱' + c.poverty_threshold; return; }
    $('#thChip').innerHTML = 'Food ₱<input id="thF" type="number" value="' + esc(c.food_threshold) + '" style="width:70px;padding:1px 4px"> Poverty ₱<input id="thP" type="number" value="' + esc(c.poverty_threshold) + '" style="width:70px;padding:1px 4px">';
    ['thF', 'thP'].forEach(function (id) { $('#' + id).onchange = function () { var f = num($('#thF').value), p = num($('#thP').value); if (f === null || p === null) return; c.food_threshold = f; c.poverty_threshold = p; store('config', { food_threshold: f, poverty_threshold: p }); route(); }; });
  }
  thChip();
  $('#newRun').onclick = function () { S.run = newRun(); S.view = 'run'; S.tab = 'roster'; route(); };
  document.addEventListener('click', function (e) {
    var v = e.target.closest('.navbtn[data-view]'); if (v) { S.view = v.dataset.view; route(); return; }
    var r = e.target.closest('[data-run]'); if (r) { e.preventDefault(); openRun(r.dataset.run, r.dataset.tab); return; }
    var t = e.target.closest('.tab'); if (t && !t.disabled) { S.tab = t.dataset.tab; renderRun(); }
  });
  window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  route();
}
if (typeof google !== 'undefined' && google.script && google.script.run) {
  google.script.run.withSuccessHandler(boot).withFailureHandler(function (e) { $('#main').innerHTML = '<div class="card">Could not load the sheet: ' + esc(e.message) + '</div>'; }).getBootstrap();
} else if (DEMO) boot(DEMO);
else $('#main').innerHTML = '<div class="card">No data source.</div>';
</script>
</body>
</html>
