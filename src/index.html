<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWDI Scoring Test Runner</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2b4c77;--teal:#0f766e;--ink:#1d2733;--muted:#5d6b7a;--line:#dfe5ec;--bg:#f4f6f9;--card:#fff;
--pass:#1b7f4b;--passbg:#e2f5ea;--fail:#b42318;--failbg:#fde4e2;--amber:#9a6200;--amberbg:#fff3d6;--blue:#1d5fb4;--bluebg:#e3eefc;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff;min-height:48px}
.top h1{font-size:16px;margin:0;font-weight:650}.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;white-space:nowrap}
.top input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:3px 7px}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 48px)}
aside{border-right:1px solid var(--line);background:#fff;overflow:auto;max-height:calc(100vh - 48px);position:sticky;top:48px;padding:10px}
.navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.navbtn:hover{background:#f1f4f8}.navbtn.on{background:#e8eef6;border-color:#cfdbe9}
.navbtn .t{font-weight:600}.navbtn .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.newbtn{width:100%;margin:6px 0 10px}
.runtools{display:flex;flex-direction:column;gap:6px;margin:0 4px 8px}.runtools input[type=search]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
.seg.sm button{padding:3px 10px;font-size:12px}.runtools .seg{width:100%}.runtools .seg button{flex:1}
.navbtn .fam{font-weight:700;font-variant-numeric:tabular-nums}.navbtn .s2{font-size:12px;color:var(--muted)}
.prog{display:inline-flex;gap:2px}.prog i{display:inline-block;width:9px;height:9px;border-radius:2px;background:#dfe5ec}.prog i.d{background:var(--teal)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 4px 4px}
main{padding:18px 22px 100px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}h3{font-size:15px;margin:0 0 10px}h4{margin:0 0 6px;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:#eef1f5;color:#3a4756;white-space:nowrap}
.v-PASS{background:var(--passbg);color:var(--pass)}.v-FAIL{background:var(--failbg);color:var(--fail)}
.v-STATA{background:var(--amberbg);color:var(--amber)}.v-ROUNDING{background:var(--amberbg);color:var(--amber)}.v-NA,.v-NOTSCORED{background:var(--bluebg);color:var(--blue)}.v-CHECK{background:var(--bluebg);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:24px;line-height:1.1}.kpi .lab{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{color:var(--navy);border-color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{background:#f5f7fa}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.sm{padding:3px 8px;font-size:12px}.btn.danger{color:var(--fail)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:14px;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:none;background:#fff;padding:6px 12px;cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
.roster input,.roster select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
details.sec{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:650;display:flex;gap:8px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 16px;padding:4px 12px 12px}
.f{display:flex;flex-direction:column;gap:3px;padding:7px 8px;border-radius:7px}
.f.sug{background:#f4f9ff}.f.chg{background:#fff6e0}
.f .q{font-size:12.5px}.f .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--muted)}
.f select,.f input[type=number],.f input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
.f .opts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
.tg{font-size:11px;color:#1d5fb4}.tg b{font-weight:600}.chgnote{font-size:11px;color:#8a5a00}
.mcard{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff;overflow:hidden}
.mhead{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#f7f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead .nm{font-weight:700}
.sticky{position:sticky;bottom:0;background:rgba(244,246,249,.96);padding:10px 0;margin-top:10px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);z-index:5}
.heat{overflow:auto}.heat table{width:auto}.heat td,.heat th{padding:4px 6px;font-size:12px;border:1px solid #eef1f5;text-align:center;min-width:52px}
.heat td.l{text-align:left;min-width:230px;white-space:nowrap}.heat td.c{cursor:pointer}.heat td.c:hover{outline:2px solid var(--navy)}
.cf{box-shadow:inset 0 -3px 0 #e2a400}
.vin{width:86px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right}
.banner{border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}.banner.warn{background:var(--amberbg);color:#6d4a00}.banner.info{background:var(--bluebg);color:#173f73}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ind{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.ind .h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eef1f5;flex-wrap:wrap}
.ind .h .lv{margin-left:auto;display:flex;gap:8px;align-items:center}
.big{font-size:18px;font-weight:700;min-width:44px;text-align:right}
.why{padding:8px 12px;font-size:13px}.why .fam{background:#f7f9fc;border-radius:6px;padding:6px 8px;margin-bottom:6px}
.mtab td{font-size:12.5px;padding:4px 6px}.mtab tr.ex td{color:#8a96a3}
.crit{font-size:12.5px;padding:0 12px 10px}.crit li{margin:2px 0}
.compare-row>td{padding:0 6px 5px}.compare{font-size:12px;color:var(--ink);background:#f7f9fc;border-radius:5px}
.compare summary{cursor:pointer;padding:4px 7px;color:var(--navy);font-weight:600}
.compare-body{padding:0 7px 6px;overflow-wrap:anywhere}.compare-body p{margin:4px 0}
.compare .mtab{background:white}.compare .mtab th,.compare .mtab td{font-size:12px;padding:3px 5px}
.compare-body details{border-top:1px solid var(--line);margin-top:5px}
.compare .lead{background:#fff;border-radius:4px;padding:5px 7px;margin:2px 0 6px}
.linkbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--passbg);border-radius:8px}
.linkbox input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12.5px;background:#fff}
.toast{position:fixed;right:18px;bottom:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}
.toast.on{opacity:1;transform:none}
.busy-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(244,246,249,.65);backdrop-filter:blur(2px)}
.busy-overlay[hidden],#thChip[hidden]{display:none!important}
.busy-dialog{display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:18px 22px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 34px rgba(29,39,51,.17);border-radius:12px;font-weight:650}
.busy-spinner{width:23px;height:23px;flex:none;border:3px solid #dae2ec;border-top-color:var(--navy);border-radius:50%;animation:busy-spin .7s linear infinite}
@keyframes busy-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.busy-spinner{animation-duration:2s}}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;align-items:center}
.tchip{display:inline-block;font-size:11px;background:#e3eefc;color:#173f73;border-radius:4px;padding:0 5px;margin:1px 3px 1px 0}
table.rep{margin:6px 0}table.rep td,table.rep th{border:1px solid #e3e8ee}
.finding{border-left:3px solid #e2a400;padding:6px 10px;margin:10px 0;background:#fffdf6}
@media print{.top,aside,.noprint,.toast{display:none!important}.wrap{display:block}main{padding:0}#report{border:none;padding:0}body{background:#fff}.finding{break-inside:avoid}}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>SWDI Scoring Test Runner</h1>
  <span class="chip" id="appRelease" aria-label="App version">__APP_RELEASE__</span>
  <span class="chip" id="modeChip">loading…</span>
  <span class="sp"></span>
  <span class="chip" id="thChip" hidden></span>
  <label class="chip">Tester <input id="tester" list="testerList" placeholder="your name" style="width:150px"><datalist id="testerList"></datalist></label>
</div>
<div class="wrap">
  <aside>
    <button class="btn pri newbtn" id="newRun">+ New test run</button>
    <button class="navbtn" data-view="overview"><div class="t">Overview &amp; coverage</div><div class="s">Progress, matrix, scenarios</div></button>
    <button class="navbtn" data-view="criteria"><div class="t">Scoring criteria</div><div class="s">Levels, coverage, weights per indicator</div></button>
    <button class="navbtn" data-view="reports"><div class="t">Reports</div><div class="s">Weekly findings, final report</div></button>
    <button class="navbtn" data-view="import"><div class="t">Import from 4Ps Forward</div><div class="s">From the SWDI Test Capture extension or a pasted score card</div></button>
    <div class="lbl">Test runs</div>
    <div class="runtools">
      <input id="runQ" type="search" placeholder="Search Family ID, run, name, tester">
      <div class="seg sm" id="runWho"><button data-w="mine">My runs</button><button data-w="all">All runs</button></div>
      <label class="small"><input type="checkbox" id="runOpen"> Unfinished only</label>
    </div>
    <div id="runList"></div>
  </aside>
  <main id="main"><div class="card">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>
<div class="busy-overlay" id="busyOverlay" hidden role="status" aria-live="polite" aria-atomic="true">
  <div class="busy-dialog"><span class="busy-spinner" aria-hidden="true"></span><span id="busyMessage">Working…</span></div>
</div>
<script>/*ENGINE*/</script>
<script>/*COVERAGE*/</script>
<script>/*PLANNING_RECORDS*/</script>
<script>/*PLANNER*/</script>
<script>/*FIELDS*/</script>
<script>/*SCENARIOS*/</script>
<script>/*FPF*/</script>
<script>
var DEMO = /*DEMO*/null;
var IND = SWDI.INDICATORS, FIELDS = SWDIFields.FIELDS, LISTS = SWDIFields.LISTS, SC = SWDIScenarios;
// Keep BRVD activity codes; add an explicit no-activity option for the SWDI App's single-select question.
LISTS.childlabor = Object.assign({ 0: 'NONE' }, LISTS.childlabor);
var childActivityField = FIELDS.filter(function (f) { return f.v === 'childlabor'; })[0];
if (childActivityField) childActivityField.q = 'Has the member been engaged in any of the following work and activities?';
var TOTALS = [{ code: 'ES', name: 'Raw ES score' }, { code: 'SA', name: 'Raw SA score' }, { code: 'TOTAL', name: 'TOTAL SWDI score' }, { code: 'LOWB', name: 'LOWB (1-3)' }];
var STATUSES = ['Draft', 'Entering in SWDI App', 'Synced — verify scores', 'Verified in SWDI App', 'Verified in 4Ps Forward', 'Blocked'];
var STATA_NOTES = { A: 'BRVD Scoring Rules rows 8 and 10: the diploma test uses the recorded gradel code, and the family average includes members aged 18 or older.', C: 'Stata: family size = all captured members − OFW; under-15 income counted; no imputed rent.',
  E: 'Stata counts insurance and accounts separately (A insurance + B account stays Level 2).', G: 'Stata: not sick → Level 3 even if confined/chronic = Yes.',
  H: 'Stata ignores overweightind, and moderate overwrites severe.', I: 'Stata keeps piped (11, 12) in the > 30 min rule; blank minutes count as > 30.', J: 'Stata operator precedence: any toilet with shared = No passes the Level 2 line.',
  L: 'Stata overwrite turns all-No (Level 1) into Level 2.', O: 'Stata overwrite ignores hazard-prone (light → 2, strong → 3).', P: 'Stata overwrite ignores hazard-prone.', U: 'Stata: any resolved problem overwrites to Level 3 (no worst case).',
  W: 'Stata: any vaccine counts, enrolment only, needs all 4 for Level 3.', Y: 'Stata: any kit item counts, savings not counted, volcanic eruption missing; 3 items without savings → no level; with 1-2 items, Level 2 overwrites "not recovered" (Level 1).' };
var ALIASES = { A: ['employable skill'], B: ['employment'], C: ['income'], D: ['social security', 'sss/gsis', 'sss'], E: ['financial institution'],
  F: ['availment', 'accessible health', 'health service', 'access to health'], G: ['health condition'], H: ['nutrition'], I: ['drinking water', 'improved water'], J: ['sanitary', 'toilet', 'sanitation'],
  K: ['garbage'], L: ['functional literacy'], M: ['digital literacy'], N: ['school', 'attendance', 'enrolment', 'enrollment'], O: ['roof'], P: ['outer wall', 'walls'],
  Q: ['tenure'], R: ['lighting'], S: ['ownership of assets', 'assets'], T: ['parenting'], U: ['discern', 'arrive at solutions', 'problem-solving', 'problem solving'], V: ['participation', 'organization'],
  W: ['rights of children', "children's rights", 'children rights'], X: ['gender', 'gbv'], Y: ['disaster', 'drrm'] };
var S = { data: null, view: 'overview', run: null, tab: 'roster', live: false, showAll: false, dirty: false, who: 'mine', q: '', openOnly: false, cap: null };
var BUSY_TOKEN = 0;

// ---------- utils ----------
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function num(v) { return SWDI.num(v); }
function fmt(x, d) { if (x === null || x === undefined || x === '') return '—'; var n = Number(x); if (isNaN(n)) return esc(x); d = d === undefined ? 4 : d; return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(d).replace(/0+$/, '').replace(/\.$/, ''); }
function dec4(x) { var n = Number(x); return isNaN(n) ? esc(x) : n.toFixed(4); }
// Level scores (indicator levels, family averages, TOTAL) always show 4 decimal places, e.g. 2.4000.
function lvlTxt(x) { return x === null || x === undefined || x === '' ? 'N/A' : dec4(x); }
function totTxt(code, x) { return x === null || x === undefined || x === '' ? '—' : code === 'TOTAL' ? dec4(x) : code === 'LOWB' ? fmt(x) : fmt(x, 5); }
function toast(t, ms) { var e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, ms || 2600); }
function beginBusy(label) {
  var token = ++BUSY_TOKEN, layer = $('#busyOverlay');
  $('#busyMessage').textContent = label;
  layer.hidden = false;
  $('#main').setAttribute('aria-busy', 'true');
  return token;
}
function endBusy(token) {
  if (token !== BUSY_TOKEN) return;
  $('#busyOverlay').hidden = true;
  $('#main').removeAttribute('aria-busy');
}
function afterPaint(label, work) {
  var token = beginBusy(label);
  requestAnimationFrame(function () {
    setTimeout(function () {
      try { work(); } catch (e) { toast('Could not complete action: ' + (e.message || e), 9000); }
      finally { endBusy(token); }
    }, 20);
  });
}
function vcls(v) { return v === 'PASS' ? 'v-PASS' : v === 'FAIL' ? 'v-FAIL' : v === 'STATA RULE' ? 'v-STATA' : v === 'ROUNDING' ? 'v-ROUNDING' : v === 'N/A CHECK' ? 'v-NA' : v === 'NOT SCORED' ? 'v-NOTSCORED' : v === 'CHECK' ? 'v-CHECK' : ''; }
function pill(v) { return v ? '<span class="pill ' + vcls(v) + '">' + esc(v) + '</span>' : ''; }
function store(k, v) { try { localStorage.setItem('swdi-runner-' + k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem('swdi-runner-' + k)); } catch (e) { return null; } }
function isAnnualTh(R) { return !!R && R.thPeriod === 'Annual'; }
/** A threshold as the engine uses it: monthly per capita (an annual value is divided by 12). */
function monthlyTh(R, v) { var n = num(v); return n === null ? null : isAnnualTh(R) ? n / 12 : n; }
function th() {
  var R = S.run, c = S.data.config;
  return R ? { food: monthlyTh(R, R.food), poverty: monthlyTh(R, R.pov) } : { food: num(c.food_threshold), poverty: num(c.poverty_threshold) };
}
/** "Food ₱24,639.00/yr → ₱2,053.25/mo · Poverty …" — the values entered and the monthly values used for grading. */
function thSummary(R) {
  var one = function (label, v) {
    var n = num(v); if (n === null) return label + ' not set';
    return label + ' ₱' + fmt(n, 2) + (isAnnualTh(R) ? '/yr → ₱' + fmt(n / 12, 2) + '/mo' : '/mo');
  };
  return one('Food', R.food) + ' · ' + one('Poverty', R.pov);
}
function thLabel(R, which) { return which + ' threshold (' + (isAnnualTh(R) ? 'annual' : 'monthly') + ' per capita, ₱)'; }
function updateThresholdChip() {
  var chip = $('#thChip'), R = S.run;
  if (!R || S.view !== 'run') { chip.hidden = true; chip.textContent = ''; return; }
  chip.hidden = false;
  chip.textContent = 'Active run · ' + thSummary(R);
  chip.title = 'Threshold values entered for this test run in ① Household & roster (' + (isAnnualTh(R) ? 'annual per capita, divided by 12 for grading' : 'monthly per capita') + '); income is graded on monthly per-capita income against the monthly values.';
}
function tester() { return $('#tester').value; }
function pad2(n) { return ('0' + n).slice(-2); }
function localStamp(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function listLabel(list, v) { var L = LISTS[list] || {}; return L[String(v)] || ''; }

// ---------- server bridge ----------
function call(fn, args, ok, fail) {
  if (S.live) {
    var r = google.script.run.withSuccessHandler(function (x) { if (ok) ok(x); })
      .withFailureHandler(function (e) { if (fail) fail(e); else toast('Error: ' + (e.message || e), 9000); });
    r[fn].apply(r, args);
  } else demoCall(fn, args, ok, fail);
}
function demoCall(fn, args, ok, fail) {
  var db = load('db') || { runs: [], roster: [], entries: [], scores: [] };
  if (fn === 'getPlanningHistory') { ok(JSON.stringify(planningRecords_(db.runs, db.scores, db.roster, db.entries, SWDICoverage.variables))); return; }
  if (fn === 'getRun') { var id = args[0], f = function (r) { return r['Run ID'] === id; }; ok(JSON.stringify({ roster: db.roster.filter(f), entries: db.entries.filter(f), scores: db.scores.filter(f) })); return; }
  if (fn === 'getRuns') {
    var many = {}; JSON.parse(args[0] || '[]').forEach(function (rid) { var g = function (r) { return r['Run ID'] === rid; }; many[rid] = { roster: db.roster.filter(g), entries: db.entries.filter(g), scores: db.scores.filter(g) }; });
    ok(JSON.stringify(many)); return;
  }
  if (fn === 'saveRun') {
    var p = JSON.parse(args[0]), run = p.run;
    if (!run['Run ID']) { var d = today().replace(/-/g, ''), n = db.runs.filter(function (r) { return String(r['Run ID']).indexOf('RUN-' + d) === 0; }).length + 1; run['Run ID'] = 'RUN-' + d + '-' + ('0' + n).slice(-2); }

// ---------- coverage ----------
function finalVerdict(r) {
  var vs = [r['SWDI App verdict'], r['4Ps Forward verdict']].filter(Boolean);
  if (!vs.length) return '';
  if (vs.indexOf('FAIL') >= 0) return 'FAIL';
  if (vs.indexOf('STATA RULE') >= 0) return 'STATA RULE';
  if (vs.indexOf('ROUNDING') >= 0) return 'ROUNDING';
  if (vs.indexOf('NOT SCORED') >= 0) return 'NOT SCORED';
  if (vs.indexOf('N/A CHECK') >= 0) return 'N/A CHECK';
  if (vs.indexOf('CHECK') >= 0) return 'CHECK';
  return 'PASS';
}
function coverage() {
  var cov = {};
  (S.data.scores || []).forEach(function (r) {
    var v = finalVerdict(r);
    String(r['Scenarios exercised'] || '').split('|').filter(Boolean).forEach(function (id) { (cov[id] = cov[id] || { runs: {}, v: [] }).runs[r['Run ID']] = 1; if (v) cov[id].v.push(v); });
  });
  return cov;
}
function scenarioStatus(c) {
  if (!c) return 'Not tested';
  if (c.v.indexOf('FAIL') >= 0) return 'FAIL';
  if (c.v.indexOf('STATA RULE') >= 0) return 'STATA RULE';
  if (c.v.indexOf('PASS') >= 0) return 'PASS';
  if (c.v.length) return 'CHECK';
  return 'Planned';
}

        var m = runMeta(x.run) || {};
        return '<tr><td>' + esc(x.run) + '</td><td>' + esc(m['Family ID (HHID)'] || '') + '</td><td>' + esc(x.platform) + '</td><td class="num">' + fv(x.expected) + '</td><td class="num">' + fv(x.stata) + '</td><td class="num">' + (x.platform === 'both' ? esc(x.observed) : fv(x.observed)) + '</td>' +
          (det.on ? '' : '<td>' + esc(x.why || '') + (x.stataWhy ? '<div><b>Stata:</b> ' + esc(x.stataWhy) + '</div>' : '') + (x.memberEvidence ? '<div style="white-space:pre-line">' + esc(x.memberEvidence) + '</div>' : '') + '</td>') + '</tr>';
      }).join('') + '</table>' +
      (det.on ? runs.map(function (id) { return reportRunBlock(f, id, det, 'F' + (i + 1), explained); }).join('') : '') + '</div>';
  });
  h += '<h2>3. Results by indicator</h2><table><tr><th>Indicator</th><th class="num">Checks</th><th class="num">PASS</th><th class="num">FAIL</th><th class="num">STATA RULE</th><th class="num">ROUNDING</th><th class="num">NOT SCORED</th><th class="num">N/A CHECK</th><th class="num">Pass rate</th></tr>' +
    R.perInd.map(function (p) { return '<tr><td><b>' + p.code + '</b> ' + esc(p.name) + '</td><td class="num">' + p.n + '</td><td class="num">' + p.pass + '</td><td class="num">' + (p.fail ? '<b style="color:#b42318">' + p.fail + '</b>' : 0) + '</td><td class="num">' + (p.stata ? '<b style="color:#9a6200">' + p.stata + '</b>' : 0) + '</td><td class="num">' + p.round + '</td><td class="num">' + p.ns + '</td><td class="num">' + p.na + '</td><td class="num">' + pct(p.pass, p.n) + '</td></tr>'; }).join('') + '</table>';
  h += '<h2>4. Test runs' + (final ? '' : ' in this period') + '</h2>' + (R.runs.length ? '<table><tr><th>Run</th><th>Family ID</th><th>Test instance</th><th>App build</th><th>Date</th><th>Tester</th><th>Mode</th><th>Status</th><th class="num">Expected total / LOWB</th><th class="num">App total</th><th class="num">4PsF total</th><th class="num">Pass / issues</th></tr>' +
    R.runs.map(function (r) { return '<tr><td>' + esc(r['Run ID']) + '</td><td>' + esc(r['Family ID (HHID)']) + '</td><td>' + esc(instanceName(r.Environment) || 'Unspecified') + '</td><td>' + esc(r['SWDI App version'] || '—') + '</td><td>' + esc(runDate(r)) + '</td><td>' + esc(r.Tester) + '</td><td>' + esc(r.Mode) + '</td><td>' + esc(r.Status) + '</td><td class="num">' + fmt(r['Expected total (target)'], 4) + ' / L' + esc(r['Expected LOWB']) +
      '</td><td class="num">' + fmt(r['SWDI App total'], 4) + '</td><td class="num">' + fmt(r['4Ps Forward total'], 4) + '</td><td class="num">' + esc(r['Checks passed']) + ' / ' + esc(r['Checks not passed']) + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">No runs in this period.</p>');
  var byNeed = {}; R.missing.forEach(function (s) { (byNeed[s.needs] = byNeed[s.needs] || []).push(s); });
  h += '<h2>5. Coverage still needed (' + R.missing.length + ' scenarios)</h2>' + (R.missing.length ? '<p class="muted">Use this to choose next week\'s households: the "Needs" column says what kind of member the household must have.</p><table><tr><th>Needs</th><th class="num">Scenarios</th><th>Examples</th></tr>' +
    Object.keys(byNeed).sort(function (a, b) { return byNeed[b].length - byNeed[a].length; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="num">' + byNeed[k].length + '</td><td>' + byNeed[k].slice(0, 3).map(function (s) { return esc(s.desc); }).join('; ') + '</td></tr>'; }).join('') + '</table>' : '<p>All catalogued scenarios have been exercised.</p>');
  h += '<h2>6. Rules to confirm with SCMD</h2><table><tr><th>Indicator</th><th>Open question</th><th class="num">Runs that hit it</th></tr>' +
    R.openRules.map(function (o) { return '<tr><td>' + o.s.ind + '</td><td>' + esc(o.s.desc) + '</td><td class="num">' + o.runs + '</td></tr>'; }).join('') +
    '<tr><td>—</td><td>Indicators with no eligible member (N/A): how the platform scores them</td><td class="num">' + R.naChecks + ' check(s)</td></tr></table>';
  if (final) {
    var openF = R.findings.filter(function (f) { return f.verdict === 'FAIL' || f.verdict === 'STATA RULE' || f.verdict === 'ROUNDING' || f.verdict === 'NOT SCORED'; }).length;
    h += '<h2>7. Completion status</h2><ul><li>Scenario coverage: <b>' + pct(R.covered, R.total) + '</b> (' + R.covered + ' of ' + R.total + ').</li><li>Open findings: <b>' + openF + '</b> (FAIL, STATA RULE, ROUNDING or NOT SCORED groups).</li>' +
      '<li>Runs verified in 4Ps Forward: <b>' + R.verified4pf + '</b> of ' + R.runs.length + '.</li><li>Open rule confirmations: <b>' + R.openRules.length + '</b>.</li></ul>' +
      '<p class="muted">Scoring can be signed off when coverage is complete (or the remaining scenarios are explicitly waived), every finding is fixed and re-tested to PASS, and SCMD has confirmed the open rules.</p>' +
      '<table style="margin-top:12px"><tr><th>Prepared by</th><th>Reviewed by</th><th>Approved by</th></tr><tr><td style="height:48px"></td><td></td><td></td></tr></table>';
  }
  return h + '<div class="foot">Generated by the SWDI Scoring Test Runner ' + esc(($('#appRelease') || {}).textContent || '') + ' on ' + esc(localStamp(new Date())) + '. Expected results come from the test runner\'s scoring engine (policy rule and BRVD Stata as written)' + (det.on ? '; the detailed findings re-grade each run from its saved answers' : '') + '.</div></div>';
}

// ---------- boot ----------
function route() {
  renderNav();
  if (S.view === 'overview') renderOverview(); else if (S.view === 'criteria') renderCriteria(); else if (S.view === 'reports') renderReports(); else if (S.view === 'import') renderImport(); else renderRun();
  updateThresholdChip();
  var dr = load('draft');
  if (S.view === 'overview' && dr && dr.run && !(S.run && S.dirty)) {
    $('#main').insertAdjacentHTML('afterbegin', '<div class="banner warn row" style="justify-content:space-between"><span>Unsaved changes for <b>' + esc(dr.run.fam || 'a new run') + '</b>' + (dr.run.id ? ' (' + esc(dr.run.id) + ')' : '') + ' from ' + esc(new Date(dr.at).toLocaleString()) + ' were kept in this browser.</span><span><button class="btn sm pri" id="drRestore">Restore</button> <button class="btn sm" id="drDrop">Discard</button></span></div>');
    $('#drRestore').onclick = function () { S.run = dr.run; S.view = 'run'; S.tab = 'roster'; S.dirty = true; route(); toast('Restored — save to keep it in the sheet'); };
    $('#drDrop').onclick = function () { store('draft', null); route(); };
  }
  window.scrollTo(0, 0);
}
function boot(json) {
  var d = typeof json === 'string' ? JSON.parse(json) : json;
  S.data = d; S.live = !!d.live;
  if (!S.live) { var db = load('db'); if (db) { d.runs = db.runs; d.scores = db.scores; d.planningRoster = planningRoster_(db.roster); } var cf = load('config'); if (cf) Object.assign(d.config, cf); }
  $('#modeChip').textContent = S.live ? 'Live · Google Sheet' : 'Preview · data stays in this browser';
  var names = (d.testers || []).slice(); if (d.user && names.indexOf(d.user) < 0) names.unshift(d.user);
  $('#testerList').innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  $('#tester').value = load('tester') || d.user || '';
  $('#tester').onchange = function () { store('tester', $('#tester').value); };
  $('#newRun').onclick = function () { S.run = newRun(); S.view = 'run'; S.tab = 'roster'; route(); };
  S.who = load('who') || 'mine';
  $('#runQ').oninput = function () { S.q = this.value; renderNav(); };
  $('#runOpen').onchange = function () { S.openOnly = this.checked; renderNav(); };
  $$('#runWho button').forEach(function (b) { b.onclick = function () { S.who = b.dataset.w; store('who', S.who); renderNav(); }; });
  $('#tester').addEventListener('input', function () { renderNav(); });
  // Unsaved work is kept in this browser every few seconds, so a closed tab or lost connection does not lose it.
  setInterval(function () { if (S.dirty && S.run) store('draft', { at: Date.now(), run: S.run }); }, 3000);
  if (S.live && google.script.url) google.script.url.getLocation(function (loc) { if (takeHash(loc.hash)) { try { google.script.history.replace(null, {}, ''); } catch (e) {} route(); } });
  else {
    var fromHash = function () { if (takeHash(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} return true; } };
    fromHash(); window.addEventListener('hashchange', function () { if (fromHash()) route(); });
  }
  document.addEventListener('click', function (e) {
    var v = e.target.closest('.navbtn[data-view]'); if (v) { S.view = v.dataset.view; route(); return; }
    var r = e.target.closest('[data-run]'); if (r) { e.preventDefault(); openRun(r.dataset.run, r.dataset.tab); return; }
    var t = e.target.closest('.tab'); if (t && !t.disabled) { S.tab = t.dataset.tab; renderRun(); }
  });
  window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  route();
}
if (typeof google !== 'undefined' && google.script && google.script.run) {
  google.script.run.withSuccessHandler(boot).withFailureHandler(function (e) { $('#main').innerHTML = '<div class="card">Could not load the sheet: ' + esc(e.message) + '</div>'; }).getBootstrap();
} else if (DEMO) boot(DEMO);
else $('#main').innerHTML = '<div class="card">No data source.</div>';
</script>
</body>
