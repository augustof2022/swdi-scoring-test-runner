name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      create_project:
        description: Create a new Apps Script project on first deployment
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the extension copy of the 4Ps Forward helpers is current
        run: git diff --exit-code extension/lib/swdi-fpf.js
      - uses: actions/upload-artifact@v4
        with:
          name: swdi-test-capture-extension
          path: |
            extension/
            !extension/**/*.md

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure clasp for deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          CREATE_PROJECT: ${{ inputs.create_project }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Set the CLASPRC_JSON repository secret for clasp deployment."
            exit 1
          fi
          if [ -z "$SCRIPT_ID" ] && [ "$CREATE_PROJECT" != "true" ]; then
            echo "::error::Set the SCRIPT_ID repository variable to the existing Apps Script project."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Push and deploy with clasp
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: npm run deploy
