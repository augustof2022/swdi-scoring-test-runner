name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the extension copy of the 4Ps Forward helpers is current
        run: git diff --exit-code extension/lib/swdi-fpf.js
      - uses: actions/upload-artifact@v4
        with:
          name: swdi-test-capture-extension
          path: |
            extension/
            !extension/**/*.md

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check clasp credentials
        id: creds
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::Secret CLASPRC_JSON is not set — skipping deployment. See README → One-time setup."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push and deploy with clasp
        if: steps.creds.outputs.ok == 'true'
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: node scripts/deploy.js
